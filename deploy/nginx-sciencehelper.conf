server {
    listen 80;
    listen [::]:80;
    server_name www.sciencehelper.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /algrism_platform;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sciencehelper.cn;

    root /algrism_platform;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.sciencehelper.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sciencehelper.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/sciencehelper.access.log;
    error_log /var/log/nginx/sciencehelper.error.log;
}
